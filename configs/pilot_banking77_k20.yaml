# Reference arm for the go target: real_fewshot at k=20 with the SAME student recipe as
# pilot_banking77.yaml (incl. max_steps cap). Go = classroom (from k=10) reaches this accuracy.
# Keep student settings in sync with pilot_banking77.yaml.
experiment:
  name: pilot_banking77_v2_k20
  seeds: [0, 1, 2]
  results_dir: results

data:
  dataset: banking77
  cache_dir: data/raw
  teacher_cache_dir: data/cache
  k_shot: 20

teacher: {provider: mock, model: none}   # not used: real_fewshot makes no teacher calls

budget:
  usd_per_arm: 0.0

arms: [real_fewshot]

student:
  kind: setfit
  setfit:
    model: sentence-transformers/all-mpnet-base-v2
    batch_size: 16
    num_epochs: 1
    num_iterations: 20
    max_steps: 2000
    head_C: 100.0
    head_max_iter: 1000

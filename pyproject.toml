[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homeroom"
version = "0.0.1"
description = "Budget-aware teacher-in-the-loop fine-tuning: a frontier model teaches small open models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "openai>=1.40",
  "anthropic>=0.40",
]

[project.optional-dependencies]
# Install torch separately with the CUDA wheel for your machine (see README).
gpu = ["setfit>=1.1", "transformers>=4.48", "datasets>=2.19", "accelerate>=0.30"]
dev = ["pytest>=8", "pre-commit>=3.7"]
report = ["matplotlib>=3.8"]

[project.scripts]
homeroom = "homeroom.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

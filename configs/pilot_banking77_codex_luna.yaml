# New Codex teacher study; never combine with historical Claude teacher runs.
# Queue costs are estimated from characters / 4 and exclude thinking/subscription costs.
# GPT-6 Luna standard API rates checked 2026-10-06:
# https://developers.openai.com/api/docs/models/gpt-6-luna
# Teacher agents use low reasoning; student/data/stopping settings match the existing pilot.
# Cap is API-equivalent estimated spend per arm, not authorization for an API provider bill.
experiment:
  name: pilot_banking77_codex_luna
  seeds:
  - 0
  - 1
  - 2
  results_dir: results
data:
  dataset: banking77
  cache_dir: data/raw
  teacher_cache_dir: data/cache
  k_shot: 10
teacher:
  provider: queue
  model: gpt-6-luna
  price_input_per_mtok: 0.1
  price_output_per_mtok: 0.5
  temperature: null
  max_tokens: 2048
  queue_timeout_s: 21600
budget:
  usd_per_arm: 0.075
arms:
- real_fewshot
- classroom
- bulk
bulk:
  examples_per_call: 20
  max_examples_per_intent: 200
  match_classroom_spend: true
classroom:
  exam_items_per_intent: 10
  lesson_examples_per_intent: 10
  max_rounds: 4
  confusions_per_round: 15
  examples_per_confusion: 8
  stop_if_score_gain_below: 0.002
  min_rounds: 2
student:
  kind: setfit
  setfit:
    model: sentence-transformers/all-mpnet-base-v2
    batch_size: 16
    num_epochs: 1
    num_iterations: 20
    max_steps: 2000
    head_C: 100.0
    head_max_iter: 1000
  hf_classifier:
    model: answerdotai/ModernBERT-base
    epochs: 5
    lr: 5.0e-05
    batch_size: 32
    max_length: 64
  tfidf:
    C: 10.0
